[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msa-systems-lab"
version = "0.1.0"
description = "Independent, correctness-first sparse-attention systems investigations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["torch==2.11.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
