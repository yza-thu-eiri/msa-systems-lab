[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msa-systems-lab"
version = "0.1.0"
description = "Independent, correctness-first sparse-attention systems investigations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["torch==2.11.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "numpy==2.5.1"]

[project.scripts]
msa-lab-train = "msa_lab.training.cli:main"
msa-lab-eval = "msa_lab.training.eval_cli:main"
msa-lab-generate = "msa_lab.training.generate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
