name: Reference checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'configs/**'
      - 'scripts/**'
      - 'docs/**'
      - 'evidence/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - '.github/workflows/reference-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'configs/**'
      - 'scripts/**'
      - 'docs/**'
      - 'evidence/**'
      - 'pyproject.toml'
      - '.github/workflows/reference-tests.yml'

permissions:
  contents: read

jobs:
  cpu-reference:
    name: P1/P2 reference acceptance (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
          python -m pip install numpy==2.5.1 pytest==9.1.1 tensorboard==2.21.0
      - name: Compile benchmark harness
        run: python -m compileall -q benchmarks scripts
      - name: Run released reference acceptance tests
        run: python -m pytest tests/ -ra
      - name: Run fixed-support walkthrough
        run: python examples/fixed_support_walkthrough.py
      - name: Run P2 router walkthrough
        run: python examples/routing_walkthrough.py
      - name: Replay synthetic two-layer FF SF FS SS
        run: python examples/c07_four_state_walkthrough.py
      - name: Audit synthetic paired predictions
        run: python scripts/audit_paired_predictions.py --input examples/p2_paired_predictions_synthetic.csv
      - name: Recompute C07 logical-work ratios
        run: python scripts/analyze_c07_work_crossover.py --lengths 128 512 2048 --output artifacts/p2-c07-work-proxy.json
      - name: Train TinyLM through FULL to SPARSE
        run: python -m msa_lab.training.cli --config configs/p2_cpu_smoke.json
      - name: Evaluate released TinyLM checkpoint
        run: python -m msa_lab.training.eval_cli --config configs/p2_cpu_smoke.json --checkpoint artifacts/p2-cpu-smoke/checkpoint_final.pt
      - name: Generate from released TinyLM checkpoint
        run: python -m msa_lab.training.generate_cli --config configs/p2_cpu_smoke.json --checkpoint artifacts/p2-cpu-smoke/checkpoint_final.pt --prompt 0,1,2,3 --max-new-tokens 2

