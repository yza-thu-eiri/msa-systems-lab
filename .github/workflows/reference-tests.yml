name: Reference checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/reference-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/reference-tests.yml'

permissions:
  contents: read

jobs:
  causal-support:
    name: P1 causal support (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.1.1
      - name: Run public support acceptance tests
        run: python -m pytest -q tests/test_support.py
